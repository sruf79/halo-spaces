<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>halo.spaces</title>
<link rel="stylesheet" href="halo.css">
<link rel="stylesheet" href="coffee-button.css">
<script src="coffee-button.js" defer></script>
<script src="halo.js" defer></script>
</head>
<body>
  <header>
    <img class="icon" src="icon.svg" alt="">
    <div>
      <h1>halo.spaces</h1>
      <p class="version" id="version"></p>
    </div>
  </header>

  <p class="note" id="platform-note" hidden></p>

  <main>
    <button id="update" class="capsule">
      <span class="label" data-l10n-en="Check for Updates"></span>
      <span class="status" id="update-status"></span>
    </button>
    <button id="settings" class="capsule">
      <span class="label" data-l10n-en="Settings…"></span>
    </button>
    <button id="close" class="capsule" hidden>
      <span class="label" data-l10n-en="Continue"></span>
    </button>
    <button id="feedback" class="capsule">
      <span class="label" data-l10n-en="Send Feedback"></span>
    </button>
    <button id="donate" class="capsule donate">
      <span class="label" data-l10n-en="Say Thanks"></span>
    </button>
    <button id="recommend" class="capsule">
      <span class="label" data-l10n-en="Recommend"></span>
    </button>
  </main>
</body>
</html>
